server:
  port: ${SERVER_PORT:8080}

app:
  bootstrap:
    email: ${AUTH_BOOTSTRAP_EMAIL:}
    password: ${AUTH_BOOTSTRAP_PASSWORD:}
  security:
    jwt-public-key: ${AUTH_JWT_PUBLIC_KEY:}
    jwt-private-key: ${AUTH_JWT_PRIVATE_KEY:}
    issuer: ${AUTH_ISSUER:https://ops-flow.local}
    audience: ${AUTH_AUDIENCE:ops-flow-api}
    access-ttl: ${AUTH_ACCESS_TTL:PT10M}
    refresh-ttl: ${AUTH_REFRESH_TTL:P7D}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

spring:
  application:
    name: ops-flow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ops_flow}
    username: ${SPRING_DATASOURCE_USERNAME:ops_flow}
    password: ${SPRING_DATASOURCE_PASSWORD:ops_flow_local}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
