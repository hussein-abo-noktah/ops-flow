server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ops-flow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ops_flow}
    username: ${SPRING_DATASOURCE_USERNAME:ops_flow}
    password: ${SPRING_DATASOURCE_PASSWORD:ops_flow_local}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
